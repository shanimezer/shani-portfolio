<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio Admin | Shani Mezer</title><link rel="stylesheet" href="../assets/styles.css"><link rel="stylesheet" href="admin.css"></head><body class="admin-page"><header class="admin-top"><a href="../index.html">← Portfolio</a><div><strong>SHANI MEZER</strong><span>Portfolio CMS</span></div><button id="newProject">+ New Project</button></header><main class="admin-layout"><aside class="admin-sidebar"><div class="sidebar-heading"><span>Projects</span><small id="projectCount"></small></div><div id="projectList" class="project-list"></div><div class="admin-tools"><button id="exportData">Export backup</button><label class="import-label">Import backup<input id="importData" type="file" accept="application/json"></label><button id="resetData" class="danger">Reset demo data</button></div></aside><section class="editor-panel"><div id="emptyEditor" class="empty-editor"><p>Select a project or create a new one.</p></div><form id="projectForm" hidden><div class="editor-head"><div><p class="admin-kicker">Project editor</p><h1 id="editorTitle">New project</h1></div><div class="editor-actions"><button type="button" id="previewProject">Preview</button><button type="button" id="deleteProject" class="danger">Delete</button><button type="submit" class="primary">Save project</button></div></div><div class="form-grid"><label class="wide">Project title<input name="title" required></label><label>URL slug<input name="id" required pattern="[a-z0-9-]+"></label><label>Year<input name="year"></label><label>Category<select name="category"><option value="directing">Directing</option><option value="games">Games</option><option value="production">Production</option><option value="social">Social Content</option><option value="editing">Editing</option><option value="ai">AI Creation</option></select></label><label>Category label<input name="categoryLabel" placeholder="Directing · Animation"></label><label>Accent color<input name="accent" type="color" value="#b9bec8"></label><label class="toggle-label"><input name="featured" type="checkbox"> Featured project</label><label class="wide">Cover image URL<input name="cover" type="url" placeholder="https://..."></label><label class="wide">Video embed URL<input name="video" type="url" placeholder="YouTube or Vimeo embed URL"></label><label class="wide">Short description<textarea name="summary" rows="3"></textarea></label><label>Role<input name="role"></label><label>Tools<input name="tools"></label><label>Client / Context<input name="client"></label><label class="wide">Challenge<textarea name="challenge" rows="4"></textarea></label><label class="wide">Approach<textarea name="approach" rows="4"></textarea></label><label class="wide">Gallery image URLs<textarea name="gallery" rows="5" placeholder="One image URL per line"></textarea><small>Paste one URL on each line.</small></label></div><div class="editor-bottom"><span id="saveStatus">Changes are stored in this browser.</span><button type="submit" class="primary">Save project</button></div></form></section></main><script src="../data/projects.js"></script><script src="../assets/cms.js"></script><script src="admin.js"></script></body></html>
